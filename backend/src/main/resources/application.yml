server:
  port: 8080

spring:
  application:
    name: apm-dashboard-backend
  datasource:
    url: jdbc:mariadb://localhost:3306/lxview?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Seoul
    username: lxview
    password: lxview
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none # 애플리케이션 실행 시 스키마 자동 변경 방지 (수동 관리)
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# ── 보안 설정 ──────────────────────────────────────────────────
jwt:
  secret: antigravity-dashboard-jwt-secret-key-for-lx-view-2026  # ⚠️ 프로덕션 배포 시 반드시 환경변수로 오버라이드

lx:
  agent:
    secret-key: lx-view-agent-secret-key-2026  # ⚠️ 프로덕션 배포 시 반드시 환경변수로 오버라이드

# ── CORS 설정 ──────────────────────────────────────────────────
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000  # 개발 환경 허용 오리진

logging:
  file:
    name: logs/lx-view-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] %-5level [%thread] %logger{0} - %msg%n"
    file: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] %-5level [%thread] %logger{0} - %msg%n"

